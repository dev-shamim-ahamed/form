</head>
<body class="bg-gray-100">
  <!-- Login Overlay (shown by default) -->
  <div id="loginOverlay">
    <div id="loginBox" class="shadow-lg">
      <div class="text-center mb-6">

          লগইন

      </div>
    </div>
  </div>

  <!-- Main Admin Dashboard (hidden by default) -->
  <div id="adminDashboard" class="min-h-screen hidden">
    <!-- Navbar -->
    <nav class="bg-blue-800 text-white shadow-lg">
      <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-4">
          <img src="logo.jpeg" alt="Logo" class="h-10 w-10 rounded bg-white p-1">

    <div class="container mx-auto px-4 py-8">
      <!-- Dashboard Cards -->

        <div class="bg-white rounded-lg shadow-md p-6">
          <div class="flex items-center justify-between">

        <div class="overflow-x-auto">

              <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">আবেদন নং</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">নাম</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">মোবাইল</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">বিভাগ</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">পেমেন্ট পদ্ধতি</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">পেমেন্ট নম্বর</th>           
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ট্রানজেকশন ID</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">পরিমাণ</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">স্ট্যাটাস</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">তারিখ</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="applicationsTable" class="bg-white divide-y divide-gray-200">

          </table>
        </div>
        
        <div class="mt-4 flex justify-between items-center">

          <div class="flex space-x-2" id="pagination">

      </div>

  </div>

  <!-- Application Details Modal -->
  <div id="applicationModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
      <div class="flex justify-between items-center border-b pb-3">

        <button id="closeModal" class="text-gray-500 hover:text-gray-700">

      </div>
      
      <div class="mt-4 space-y-4" id="modalContent">
        <!-- Application details will be loaded here -->
      </div>

        <button id="rejectBtn" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">

        </button>
        <button id="approveBtn" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
          <i class="fas fa-check mr-2"></i>অনুমোদন

    </div>
  </div>
  
  <!-- Payment Details Modal -->
  <div id="paymentModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold" id="paymentModalTitle">পেমেন্ট বিস্তারিত</h3>
        <button id="closePaymentModal" class="text-gray-500 hover:text-gray-700">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="mt-4 space-y-4" id="paymentModalContent">
        <!-- Payment details will be loaded here -->
      </div>
      
      <div class="mt-6 pt-4 border-t flex justify-end space-x-4">
        <button id="rejectPaymentBtn" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
          <i class="fas fa-times mr-2"></i>প্রত্যাখ্যান
        </button>
        <button id="approvePaymentBtn" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
          <i class="fas fa-check mr-2"></i>অনুমোদন
        </button>
      </div>
    </div>
  </div>

  <script>
    // Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyDuaWMh0eIJ2tdtLxYj43ij9MGSh_Yo22M",
  authDomain: "test-6977e.firebaseapp.com",
  projectId: "test-6977e",
  storageBucket: "test-6977e.firebasestorage.app",
  messagingSenderId: "544329273038",
  appId: "1:544329273038:web:c7a31e12bec7c80741ca9f"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Global variables
let currentApplicationId = null;
let currentPaymentId = null;
let applications = [];
let filteredApplications = [];
let payments = {}; // Store all payments by applicationId
const itemsPerPage = 10;
let currentPage = 1;

// Hardcoded admin credentials
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "admin123";
let isAuthenticated = false;

// DOM elements
const loginOverlay = document.getElementById('loginOverlay');
const adminDashboard = document.getElementById('adminDashboard');
const loginError = document.getElementById('loginError');
const adminUsername = document.getElementById('adminUsername');
const adminPassword = document.getElementById('adminPassword');
const adminLoginBtn = document.getElementById('adminLoginBtn');
const logoutBtn = document.getElementById('logoutBtn');

// Check if user is already logged in (from session)
if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
  isAuthenticated = true;
  loginOverlay.style.display = 'none';
  adminDashboard.classList.remove('hidden');
  loadData();
}

// Login function
adminLoginBtn.addEventListener('click', () => {
  const username = adminUsername.value;
  const password = adminPassword.value;
  
  if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
    // Successful login
    isAuthenticated = true;
    sessionStorage.setItem('isAdminLoggedIn', 'true');
    loginOverlay.style.display = 'none';
    adminDashboard.classList.remove('hidden');
    
    // Clear login fields
    adminUsername.value = "";
    adminPassword.value = "";
    loginError.classList.add('hidden');
    
    // Load data
    loadData();
  } else {
    // Failed login
    loginError.textContent = "ভুল ইউজারনেম বা পাসওয়ার্ড";
    loginError.classList.remove('hidden');
  }
});

// Logout function
logoutBtn.addEventListener('click', () => {
  isAuthenticated = false;
  sessionStorage.removeItem('isAdminLoggedIn');
  loginOverlay.style.display = 'flex';
  adminDashboard.classList.add('hidden');
  adminUsername.value = "";
  adminPassword.value = "";
  loginError.classList.add('hidden');
});

// Load all data (applications and payments)
function loadData() {
  loadApplications();
  loadPayments();
}

// Load applications from Firestore
function loadApplications() {
  db.collection('applications')
    .orderBy('createdAt', 'desc')
    .onSnapshot((snapshot) => {
      applications = [];
      snapshot.forEach((doc) => {
        const data = doc.data();
        const application = {
          id: doc.id,
          applicationNumber: data.applicationNumber || 'N/A',
          applicantName: data.applicantName || data.name || 'N/A',
          mobile: data.mobile || 'N/A',
          division: data.division || 'N/A',
          status: data.status || 'pending',
          createdAt: data.createdAt || firebase.firestore.FieldValue.serverTimestamp(),
          // Additional fields
          fatherName: data.fatherName || 'N/A',
          motherName: data.motherName || 'N/A',
          dob: data.dob || 'N/A',
          bloodGroup: data.bloodGroup || 'N/A',
          jila: data.jila || 'N/A',
          upozila: data.upozila || 'N/A',
          permanentAddress: data.permanentAddress || 'N/A',
          paymentCompleted: data.paymentCompleted || false,
          paymentStatus: data.paymentStatus || 'pending'
        };
        applications.push(application);
      });
      
      updateDashboardCounts();
      filterApplications();
    }, (error) => {
      console.error("Error loading applications:", error);
      document.getElementById('applicationsTable').innerHTML = `
        <tr>
          <td colspan="11" class="px-6 py-4 text-center text-red-600">ডেটা লোড করতে সমস্যা হয়েছে</td>
        </tr>
      `;
    });
}

// Load all payments from Firestore
function loadPayments() {
  db.collection('payments')
    .onSnapshot((snapshot) => {
      payments = {};
      snapshot.forEach((doc) => {
        const payment = doc.data();
        payments[payment.applicationId] = {
          method: payment.method || 'N/A',
          paymentNumber: payment.paymentNumber || 'N/A', // Added payment number
          transactionId: payment.transactionId || 'N/A',
          amount: payment.amount || 'N/A',
          status: payment.status || 'pending',
          paymentDate: payment.paymentDate || firebase.firestore.FieldValue.serverTimestamp()
        };
      });
      
      // Refresh applications table after payments load
      if (applications.length > 0) {
        filterApplications();
      }
    });
}

// Update dashboard counts
function updateDashboardCounts() {
  const total = applications.length;
  const approved = applications.filter(app => app.status === 'approved').length;
  const pending = applications.filter(app => app.status === 'pending').length;
  const rejected = applications.filter(app => app.status === 'rejected').length;
  
  document.getElementById('totalApplications').textContent = total;
  document.getElementById('approvedApplications').textContent = approved;
  document.getElementById('pendingApplications').textContent = pending;
  document.getElementById('rejectedApplications').textContent = rejected;
}

// Filter applications based on search and status
function filterApplications() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const statusFilter = document.getElementById('statusFilter').value;
  
  filteredApplications = applications.filter(app => {
    const matchesSearch = 
      (app.applicationNumber && app.applicationNumber.toLowerCase().includes(searchTerm)) ||
      (app.applicantName && app.applicantName.toLowerCase().includes(searchTerm)) ||
      (app.mobile && app.mobile.includes(searchTerm));
    
    const matchesStatus = 
      statusFilter === 'all' || 
      app.status === statusFilter;
    
    return matchesSearch && matchesStatus;
  });
  
  renderApplicationsTable();
  renderPagination();
}

// Render applications table with payment data
function renderApplicationsTable() {
  const tableBody = document.getElementById('applicationsTable');
  tableBody.innerHTML = '';
  
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = startIndex + itemsPerPage;
  const paginatedApps = filteredApplications.slice(startIndex, endIndex);
  
  if (paginatedApps.length === 0) {
    tableBody.innerHTML = `
      <tr>
        <td colspan="11" class="px-6 py-4 text-center text-gray-500">কোন আবেদন পাওয়া যায়নি</td>
      </tr>
    `;
    return;
  }
  
  paginatedApps.forEach(app => {
    const payment = payments[app.id] || {};
    
    let statusBadge;
    if (app.status === 'approved') {
      statusBadge = `<span class="status-badge status-approved">অনুমোদিত</span>`;
    } else if (app.status === 'rejected') {
      statusBadge = `<span class="status-badge status-rejected">প্রত্যাখ্যাত</span>`;
    } else {
      statusBadge = `<span class="status-badge status-pending">পেন্ডিং</span>`;
    }
    
    const createdAt = app.createdAt?.toDate ? new Date(app.createdAt.toDate()).toLocaleDateString('bn-BD') : 
                     app.createdAt ? new Date(app.createdAt.seconds * 1000).toLocaleDateString('bn-BD') : 'N/A';
    
    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${app.applicationNumber}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${app.applicantName}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${app.mobile}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${app.division}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${payment.method || 'N/A'}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${payment.paymentNumber || 'N/A'}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${payment.transactionId || 'N/A'}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${payment.amount ? '৳' + payment.amount : 'N/A'}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${statusBadge}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${createdAt}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
        <button class="text-blue-600 hover:text-blue-900 view-btn" data-id="${app.id}">বিস্তারিত</button>
      </td>
    `;
    tableBody.appendChild(row);
  });
  
  // Add event listeners to view buttons
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => viewApplication(btn.dataset.id));
  });
  
  // Update table info
  document.getElementById('tableInfo').textContent = 
    `${startIndex + 1}-${Math.min(endIndex, filteredApplications.length)} টি আবেদন দেখানো হচ্ছে (মোট ${filteredApplications.length})`;
}

// View application details
function viewApplication(id) {
  currentApplicationId = id;
  const app = applications.find(a => a.id === id);
  const payment = payments[id] || {};
  
  if (!app) return;
  
  document.getElementById('modalTitle').textContent = `আবেদন বিস্তারিত - ${app.applicationNumber || 'N/A'}`;
  
  let statusBadge;
  if (app.status === 'approved') {
    statusBadge = `<span class="status-badge status-approved">অনুমোদিত</span>`;
  } else if (app.status === 'rejected') {
    statusBadge = `<span class="status-badge status-rejected">প্রত্যাখ্যাত</span>`;
  } else {
    statusBadge = `<span class="status-badge status-pending">পেন্ডিং</span>`;
  }
  
  const createdAt = app.createdAt?.toDate ? new Date(app.createdAt.toDate()).toLocaleDateString('bn-BD') : 
                   app.createdAt ? new Date(app.createdAt.seconds * 1000).toLocaleDateString('bn-BD') : 'N/A';
  
  const updatedAt = app.updatedAt?.toDate ? new Date(app.updatedAt.toDate()).toLocaleDateString('bn-BD') : 
                   app.updatedAt ? new Date(app.updatedAt.seconds * 1000).toLocaleDateString('bn-BD') : 'N/A';
  
  const paymentDate = payment.paymentDate?.toDate ? new Date(payment.paymentDate.toDate()).toLocaleDateString('bn-BD') :

// Close modal
document.getElementById('closeModal').addEventListener('click', () => {
  document.getElementById('applicationModal').classList.add('hidden');
});

// Approve application
document.getElementById('approveBtn').addEventListener('click', () => {
  if (!currentApplicationId) return;
  
  if (!confirm('আপনি কি এই আবেদনটি অনুমোদন করতে চান?')) {
    return;
  }
  
  db.collection('applications').doc(currentApplicationId).update({
    status: 'approved',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    alert('আবেদন সফলভাবে অনুমোদন করা হয়েছে');
    document.getElementById('applicationModal').classList.add('hidden');
  })
  .catch(error => {
    alert('ত্রুটি: ' + error.message);
    console.error("Error approving application:", error);
  });
});

// Reject application
document.getElementById('rejectBtn').addEventListener('click', () => {
  if (!currentApplicationId) return;
  
  if (!confirm('আপনি কি এই আবেদনটি প্রত্যাখ্যান করতে চান?')) {
    return;
  }
  
  db.collection('applications').doc(currentApplicationId).update({
    status: 'rejected',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    alert('আবেদন সফলভাবে প্রত্যাখ্যান করা হয়েছে');
    document.getElementById('applicationModal').classList.add('hidden');
  })
  .catch(error => {
    alert('ত্রুটি: ' + error.message);
    console.error("Error rejecting application:", error);
  });
});

// Render pagination
function renderPagination() {
  const totalPages = Math.ceil(filteredApplications.length / itemsPerPage);
  const paginationDiv = document.getElementById('pagination');
  paginationDiv.innerHTML = '';
  
  if (totalPages <= 1) return;
  
  // Previous button
  const prevBtn = document.createElement('button');
  prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
  prevBtn.className = 'px-3 py-1 border rounded-md';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      renderApplicationsTable();
    }
  });
  paginationDiv.appendChild(prevBtn);
  
  // Page numbers
  const maxVisiblePages = 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
  let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
  
  if (endPage - startPage + 1 < maxVisiblePages) {
    startPage = Math.max(1, endPage - maxVisiblePages + 1);
  }
  
  if (startPage > 1) {
    const firstPageBtn = document.createElement('button');
    firstPageBtn.textContent = '1';
    firstPageBtn.className = 'px-3 py-1 border rounded-md mx-1';
    firstPageBtn.addEventListener('click', () => {
      currentPage = 1;
      renderApplicationsTable();
    });
    paginationDiv.appendChild(firstPageBtn);
    
    if (startPage > 2) {
      const ellipsis = document.createElement('span');
      ellipsis.textContent = '...';
      ellipsis.className = 'px-3 py-1';
      paginationDiv.appendChild(ellipsis);
    }
  }
  
  for (let i = startPage; i <= endPage; i++) {
    const pageBtn = document.createElement('button');
    pageBtn.textContent = i;
    pageBtn.className = `px-3 py-1 border rounded-md mx-1 ${currentPage === i ? 'bg-blue-600 text-white' : ''}`;
    pageBtn.addEventListener('click', () => {
      currentPage = i;
      renderApplicationsTable();
    });
    paginationDiv.appendChild(pageBtn);
  }
  
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) {
      const ellipsis = document.createElement('span');
      ellipsis.textContent = '...';
      ellipsis.className = 'px-3 py-1';
      paginationDiv.appendChild(ellipsis);
    }
    
    const lastPageBtn = document.createElement('button');
    lastPageBtn.textContent = totalPages;
    lastPageBtn.className = 'px-3 py-1 border rounded-md mx-1';
    lastPageBtn.addEventListener('click', () => {
      currentPage = totalPages;
      renderApplicationsTable();
    });
    paginationDiv.appendChild(lastPageBtn);
  }
  
  // Next button
  const nextBtn = document.createElement('button');
  nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
  nextBtn.className = 'px-3 py-1 border rounded-md';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) {
      currentPage++;
      renderApplicationsTable();
    }
  });
  paginationDiv.appendChild(nextBtn);
}

// Event listeners for filters

  currentPage = 1;
  filterApplications();
});

  if (event.target === document.getElementById('paymentModal')) {

});
